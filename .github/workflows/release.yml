# v로 시작하는 태그(예: v1.0.1)를 올리면 확장 파일만 담은 ZIP을 만들어 Releases에 올린다.
# 수동 실행(workflow_dispatch)하면 릴리스 없이 ZIP만 Actions 아티팩트로 만든다.
name: Release ZIP

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: manifest 버전과 태그 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version manifest.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::manifest.json version($version)과 태그($tag)가 달라요."
            exit 1
          fi

      - name: ZIP 만들기
        run: |
          python3 tools/package.py --output .
          unzip -l Convenient_BOJ.zip
          unzip -tq Convenient_BOJ-webstore.zip

      - name: 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Convenient_BOJ
          path: |
            Convenient_BOJ.zip
            Convenient_BOJ-webstore.zip

      - name: Releases에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Convenient_BOJ.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Convenient BOJ $GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          ## 설치
          1. 아래 **Convenient_BOJ.zip** 을 내려받아 압축을 풉니다.
          2. 크롬 주소창에 `chrome://extensions` 를 입력하고, 오른쪽 위 **개발자 모드**를 켭니다.
          3. **압축해제된 확장 프로그램을 로드합니다** → 압축을 푼 `Convenient_BOJ` 폴더를 고릅니다.

          업데이트할 때는 새 ZIP을 받아 같은 폴더에 덮어쓰고, `chrome://extensions` 에서 새로고침(↻)을 누르면 됩니다.

          ## 내 PC에서 실행 (진짜 터미널, 선택)
          압축을 푼 폴더의 `host\install.bat` 을 더블클릭하고 묻는 대로 답하면 돼요. (Windows)
          NOTES
          )" \
            --generate-notes
