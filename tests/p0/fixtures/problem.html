<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="username" content="fixture-user">
<title>A+B · 로컬 테스트</title>
<style>
  body { margin: 0; color: #333; font: 16px/1.6 "Malgun Gothic", sans-serif; }
  .container { max-width: 1040px; margin: auto; padding: 20px 32px; }
  header { border-bottom: 1px solid #ddd; color: #555; }
  h1 { margin-bottom: 8px; }
  h2 { font-size: 20px; border-bottom: 1px solid #ddd; }
  .btn { background: #0076c0; color: white; border: 0; padding: 6px 12px; border-radius: 3px; }
  #samples { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  pre { background: #f5f5f5; border: 1px solid #ddd; padding: 8px; }
</style>
<header><div class="container">로컬 테스트 페이지 · 문제</div></header>
<main class="container">
  <h1 id="problem_title">A+B</h1>
  <div class="problem-button"></div>
  <article id="problem-body">
    <h2>문제</h2>
    <p>두 정수 A와 B를 입력받아 A+B를 출력하는 프로그램을 작성하시오.</p>
    <h2>입력</h2><p>첫째 줄에 A와 B가 주어진다.</p>
    <h2>출력</h2><p>두 정수의 합을 출력한다.</p>
    <section id="samples">
      <div><h2>예제 입력 1</h2><pre id="sample-input-1">2 3
</pre></div>
      <div><h2>예제 출력 1</h2><pre id="sample-output-1">5
</pre></div>
      <div><h2>예제 입력 2</h2><pre id="sample-input-2">4 5
</pre></div>
      <div><h2>예제 출력 2</h2><pre id="sample-output-2">9
</pre></div>
    </section>
  </article>
</main>
</html>
